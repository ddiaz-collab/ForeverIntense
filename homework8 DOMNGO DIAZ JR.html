<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <style>
        body {
            max-width: 640px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            background-color: gold;
            color: red;
        }

        h1 {
            margin-top: 0;
        }

        button[type="submit"] {
            padding: 8px 14px;
            cursor: pointer;
        }

        form {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #ccc;
        }

        label,
        input,
        textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        input,
        textarea {
            margin: 4px 0 12px;
            padding: 8px;
            font-family: inherit;
            background-color: gold;
        }

        textarea {
            min-height: 90px;
        }

        .input-valid {
            border-color: rgb(25, 158, 158);
        }

        p[role="alert"] {
            color: #b00020;
            margin: -8px 0 10px;
        }
    </style>
</head>
<body>

    <h1>Contact Page</h1>

    <section aria-labelledby="aboutHeading">
        <h2 id="aboutHeading">About Me</h2>
        <p>Hi, I'm Domingo Diaz Jr., a web development student learning how to build accessible, validated HTML forms with JavaScript.</p>
    </section>

    <form id="contactForm" novalidate>
        <h2>Contact me</h2>
        <label for="contactName">Contact Name</label>
        <input id="contactName" name="name" type="text" value="Domingo Diaz Jr" autocomplete="name" required aria-describedby="nameError">
        <p id="nameError" role="alert"></p>

        <label for="contactEmail">Contact Email</label>
        <input id="contactEmail" name="email" type="email" value="ddiaz@my.campus.edu" autocomplete="email" required aria-describedby="emailError">
        <p id="emailError" role="alert"></p>

        <label for="contactPhone">Contact Phone</label>
        <input id="contactPhone" name="phone" type="tel" autocomplete="tel" aria-describedby="phoneError">
        <p id="phoneError" role="alert"></p>

        <label for="contactMessage">Contact Message</label>
        <textarea id="contactMessage" name="message" required aria-describedby="messageError">Let's all grow</textarea>
        <p id="messageError" role="alert"></p>

        <button type="submit">Send message</button>
        <p id="formStatus" role="status" aria-live="polite"></p>
    </form>

    <section aria-labelledby="adviceHeading">
        <h2 id="adviceHeading">Advice from Domingo</h2>
        <p id="adviceMessage" aria-live="polite">Submit a valid message to receive a piece of advice.</p>
    </section>

    <script>
        const contactForm = document.querySelector("#contactForm");
        const formStatus = document.querySelector("#formStatus");
        const contactFields = [
            { input: document.querySelector("#contactName"), error: document.querySelector("#nameError"),
                message: "Please enter your name." },
            { input: document.querySelector("#contactEmail"), error: document.querySelector("#emailError"),
                message: "Please enter a valid email address (e.g., ddiaz@my.campus.edu)." },
            { input: document.querySelector("#contactPhone"), error: document.querySelector("#phoneError"),
                message: "Please enter your phone number." },
            { input: document.querySelector("#contactMessage"), error: document.querySelector("#messageError"),
                message: "Please enter a message." }
        ];

        // Empty-field and format validation (relies on each input's type/required attributes)
        function validateContactField(field) {
            const input = field.input;
            const error = field.error;
            const invalid = (input.required && input.value.trim() === "") ||
                (input.value.trim() !== "" && !input.validity.valid);

            error.textContent = invalid ? field.message : "";
            input.setAttribute("aria-invalid", String(invalid));
            return !invalid;
        }

        // Clear the error as soon as the user starts fixing the field
        contactFields.forEach(function (field) {
            field.input.addEventListener("input", function () {
                field.error.textContent = "";
                field.input.setAttribute("aria-invalid", "false");
                field.input.classList.toggle("input-valid", field.input.validity.valid);
                field.input.style.borderColor = field.input.validity.valid ? "" : "crimson";
            });
        });

        contactForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const formIsValid = contactFields.map(validateContactField).every(Boolean);

            if (!formIsValid) {
                formStatus.textContent = "Please correct the highlighted fields.";
                return;
            }

            formStatus.textContent = "Thank you. Your message was submitted successfully.";

            const adviceMessage = document.querySelector("#adviceMessage");
            adviceMessage.textContent = "Loading advice...";

            // Bonus: fetch a free public API and handle both network and HTTP errors
            fetch("https://api.adviceslip.com/advice")
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("Advice request failed.");
                    }
                    return response.json();
                })
                .then(function (data) {
                    adviceMessage.textContent = data.slip.advice;
                })
                .catch(function () {
                    adviceMessage.textContent = "Advice is unavailable right now. Please try again later.";
                });
        });
    </script>
</body>
</html>
