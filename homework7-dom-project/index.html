<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <style>
        body {
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 20px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            color: #002868;
            background-color: #ffd700;
        }

        h1 {
            margin-top: 0;
        }

        #toggleDetails,
        #addThing,
        button[type="submit"] {
            padding: 8px 14px;
            cursor: pointer;
            background-color: #002868;
            color: #fff;
            border: 1px solid #bf0a30;
            border-radius: 4px;
        }

        #toggleDetails:hover,
        #addThing:hover,
        button[type="submit"]:hover {
            background-color: #bf0a30;
        }

        form {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #ccc;
        }

        label,
        input,
        textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        input,
        textarea {
            margin: 4px 0 12px;
            padding: 8px;
            border: 1px solid #002868;
            border-radius: 4px;
            font-family: inherit;
        }

        textarea {
            min-height: 90px;
        }

        .input-valid {
            border-color: teal;
        }

        li button {
            background-color: #bf0a30;
            color: #fff;
            border: 1px solid #8a0018;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }

        li button:hover {
            background-color: #8a0018;
        }

        p[role="alert"] {
            color: #bf0a30;
            margin: -8px 0 10px;
        }
    </style>
</head>
<body>

    <h1>Contact Page</h1>

    <section>
        <h2>Things to do</h2>
        <label for="thingInput">Add an item</label>
        <input id="thingInput" type="text">
        <button id="addThing" type="button">Add</button>
        <ul id="thingsList"></ul>
    </section>

    <form id="contactForm" novalidate>
        <h2>Contact me</h2>
        <label for="contactName">Contact Name</label>
        <input id="contactName" name="name" type="text" value="Domingo Diaz Jr" autocomplete="name" required aria-describedby="nameError">
        <p id="nameError" role="alert"></p>

        <label for="contactEmail">Contact Email</label>
        <input id="contactEmail" name="email" type="email" value="ddiaz@my.campus.edu" autocomplete="email" required aria-describedby="emailError">
        <p id="emailError" role="alert"></p>

        <label for="contactMessage">Contact Message</label>
        <textarea id="contactMessage" name="message" required aria-describedby="messageError">Let's all grow</textarea>
        <p id="messageError" role="alert"></p>

        <button type="submit">Send message</button>
        <p id="formStatus" role="status" aria-live="polite"></p>
    </form>

    <script src="script.js"></script>

</body>
</html>
